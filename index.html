<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>皇冠 · 卡牌战斗</title>
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<div id="lobby">
  <div class="lobby-content">
    <h1>皇冠 · 卡牌战斗</h1>
    <p>选择你的英雄和对手，开始对决</p>
    <div class="lobby-section">
      <label>选择英雄</label>
      <div class="hero-grid" id="heroGrid"></div>
    </div>
    <div class="lobby-section">
      <label>选择对手</label>
      <div class="hero-grid" id="oppGrid"></div>
    </div>
    <button id="btnStart" class="btn-start" disabled>开始对决</button>
  </div>
</div>
<div id="app" hidden>
  <div class="bar">
    <span class="brand">皇冠 · 卡牌战斗</span>
    <span id="turnInfo"></span>
    <button id="btnGuide" class="icon-btn" title="查看新手指南">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </button>
    <button id="btnTheme" class="icon-btn" title="切换明暗主题">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <button id="btnNew" class="icon-btn" title="开始新对局">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.39 0 4.68.94 6.36 2.64L21 3v6h-6"/></svg>
    </button>
  </div>
  <div id="board">
    <div class="side top" id="sideTop">
      <div class="hero" id="heroTop"></div>
      <div class="hand" id="handTop"></div>
      <div class="field" id="fieldTop"></div>
    </div>
    <div class="divider"></div>
    <div class="side bot" id="sideBot">
      <div class="field" id="fieldBot"></div>
      <div class="hand" id="handBot"></div>
      <div class="hero" id="heroBot"></div>
    </div>
  </div>
  <div id="actionBar">
    <button id="btnEnd" class="btn-end" title="结束回合">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    </button>
  </div>
  <aside id="log"></aside>
  <div id="banner"><div class="t"></div><div class="w"></div><div class="s"></div></div>
  <div id="modal"><div id="modal-content"></div></div>
</div>
<script src="cards.js?v=12"></script>
<script src="engine.js?v=12"></script>
<script src="ai.js?v=12"></script>
<script src="ui.js?v=12"></script>
</body>
</html>
